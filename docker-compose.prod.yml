# Producao: HTTPS obrigatorio. Caddy recebe na 80/443, emite o certificado TLS e repassa para o gunicorn.
# Uso:  cp .env.prod.example .env.prod  (e preencha)  ->  docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 5
    restart: unless-stopped
    # sem "ports": o banco nao fica exposto fora da rede interna do docker

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py createcachetable
                    && python manage.py collectstatic --noinput
                    && gunicorn config.wsgi:application -b 0.0.0.0:8000 --workers 3 --access-logfile -"
    env_file: .env.prod
    volumes:
      - estaticos:/app/staticfiles
      - anexos:/app/media          # anexos: so o Django le (download exige login)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: caddy:2.8
    env_file: .env.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - estaticos:/srv/static:ro
      - caddy_dados:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  estaticos:
  anexos:
  caddy_dados:
